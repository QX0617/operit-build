name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-chat/package-lock.json

      - name: Configure Gradle wrapper
        run: |
          # Use official Gradle distribution
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties | grep distributionUrl

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=operit123
          RELEASE_KEY_ALIAS=operit
          RELEASE_KEY_PASSWORD=operit123
          EOF

      - name: Generate release keystore
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias operit \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass operit123 \
              -keypass operit123 \
              -dname "CN=Operit, OU=Dev, O=Operit, L=NA, ST=NA, C=CN"
          fi
          ls -la release.keystore

      - name: Install npm dependencies
        run: npm ci

      - name: Build web-chat
        run: |
          if [ -d web-chat ]; then
            cd web-chat && npm ci && npm run build
            cd ..
          fi

      - name: Download STT model assets
        run: |
          mkdir -p app/build/generated/stt-model-assets/models/sherpa-ncnn-streaming-zipformer-bilingual-zh-en-2023-02-13
          BASE="https://huggingface.co/csukuangfj/sherpa-ncnn-streaming-zipformer-bilingual-zh-en-2023-02-13/resolve/05945efc40afe4b572542f01104ca5c413a9f6e1"
          DEST="app/build/generated/stt-model-assets/models/sherpa-ncnn-streaming-zipformer-bilingual-zh-en-2023-02-13"
          SILERO_URL="https://huggingface.co/safestack/silero-vad/resolve/8a63e2e86cf654d7ba19fbedbccce5ff55de3c60/data/silero_vad_16k_op15.onnx"

          echo "Downloading silero_vad.onnx..."
          curl -L --retry 5 -o app/build/generated/stt-model-assets/models/silero_vad.onnx "$SILERO_URL"

          for f in decoder_jit_trace-pnnx.ncnn.bin decoder_jit_trace-pnnx.ncnn.param encoder_jit_trace-pnnx.ncnn.bin encoder_jit_trace-pnnx.ncnn.param joiner_jit_trace-pnnx.ncnn.bin joiner_jit_trace-pnnx.ncnn.param tokens.txt; do
            echo "Downloading $f..."
            curl -L --retry 5 -o "$DEST/$f" "$BASE/$f"
          done

          echo "STT model files downloaded:"
          find app/build/generated/stt-model-assets -type f -exec ls -lh {} \;

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain
        env:
          GRADLE_OPTS: "-Xmx6g -Dorg.gradle.jvmargs=-Xmx6g"
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Operit-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
